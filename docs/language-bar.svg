<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 176" role="img" aria-labelledby="title desc">
  <title id="title">Angel Gates repository language mix</title>
  <desc id="desc">A segmented language bar showing Python 77.4%, JavaScript 16.6%, CSS 3.2%, Shell 2.1%, and HTML 0.7%.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#22282c"/>
      <stop offset="1" stop-color="#11140f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="920" height="176" rx="16" fill="url(#panel)"/>
  <g filter="url(#shadow)">
    <rect x="28" y="56" width="864" height="34" rx="17" fill="#0f1110"/>
    <path d="M45 56H697.2V90H45A17 17 0 0 1 28 73A17 17 0 0 1 45 56Z" fill="#3776ab"/>
    <rect x="697.2" y="56" width="143.4" height="34" fill="#f0db4f"/>
    <rect x="840.6" y="56" width="27.6" height="34" fill="#264de4"/>
    <rect x="868.2" y="56" width="18.2" height="34" fill="#89e051"/>
    <path d="M886.4 56H875A17 17 0 0 1 892 73A17 17 0 0 1 875 90H886.4Z" fill="#e34c26"/>
  </g>
  <text x="28" y="31" fill="#f0b429" font-family="Consolas, Cascadia Mono, monospace" font-size="13" font-weight="700">REPOSITORY LANGUAGE MIX</text>
  <g font-family="Aptos, Segoe UI, sans-serif" font-size="17" font-weight="700">
    <circle cx="36" cy="122" r="6" fill="#3776ab"/>
    <text x="50" y="128" fill="#fffdf7">Python 77.4%</text>
    <circle cx="206" cy="122" r="6" fill="#f0db4f"/>
    <text x="220" y="128" fill="#fffdf7">JavaScript 16.6%</text>
    <circle cx="420" cy="122" r="6" fill="#264de4"/>
    <text x="434" y="128" fill="#fffdf7">CSS 3.2%</text>
    <circle cx="548" cy="122" r="6" fill="#89e051"/>
    <text x="562" y="128" fill="#fffdf7">Shell 2.1%</text>
    <circle cx="680" cy="122" r="6" fill="#e34c26"/>
    <text x="694" y="128" fill="#fffdf7">HTML 0.7%</text>
  </g>
  <text x="28" y="154" fill="#a9aba4" font-family="Aptos, Segoe UI, sans-serif" font-size="13">Edge runtime, dashboard UI, deployment scripts, and proposal page.</text>
</svg>
